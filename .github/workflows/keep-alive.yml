name: Keep Render awake

# Sur le plan gratuit de Render, le service se met en veille après ~15 min
# sans trafic. Ce workflow ping régulièrement /health pour le garder actif.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" \
            https://muslim-ia-api.onrender.com/health || true
